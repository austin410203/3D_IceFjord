<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潮聲島・渲染技巧實驗室</title>
<style>
  :root {
    --panel: rgba(12, 18, 26, 0.78);
    --line: rgba(160, 200, 230, 0.16);
    --text: #e6eef5;
    --muted: #8fa3b5;
    --accent: #ffb070;
    --cold: #7fd3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1118; color: var(--text);
    font: 14px/1.5 "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", system-ui, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1118; z-index: 5; transition: opacity .6s; }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader small { display: block; color: var(--muted); letter-spacing: .2em; margin-top: 6px; text-align: center; }

  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 340px; display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; z-index: 3; overflow: hidden; }
  #panel.hidden { display: none; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .04em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  header a:hover { text-decoration: underline; }
  .scroll { overflow-y: auto; padding: 4px 16px 14px; flex: 1; }
  h2 { font-size: 11px; color: var(--muted); letter-spacing: .18em; margin: 14px 0 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--text); padding: 5px 10px;
    border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--cold); }
  .chip.on { background: var(--accent); color: #1b1006; border-color: var(--accent); font-weight: 600; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px; padding: 6px 6px; border-radius: 8px; cursor: pointer; }
  .row:hover, .row.focus { background: rgba(127, 211, 255, 0.09); }
  .row input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; cursor: pointer; }
  .row .num { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .row select { background: #16212c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; padding: 1px 4px; }
  #info { border-top: 1px solid var(--line); padding: 12px 16px; max-height: 42%; overflow-y: auto; background: rgba(0,0,0,0.18); }
  #info .src { color: var(--cold); font-size: 12px; margin: 2px 0 6px; }
  #info .what { color: #c7d3de; font-size: 13px; margin: 0 0 8px; }
  #info .label { color: var(--accent); font-size: 11px; letter-spacing: .14em; margin-bottom: 3px; }
  #info .prompt { font-size: 13px; background: rgba(255,176,112,0.08); border-left: 2px solid var(--accent); padding: 6px 8px; border-radius: 4px; margin: 0; white-space: pre-wrap; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn { flex: 1; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 8px; padding: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { background: rgba(255,176,112,0.12); }
  #hud { position: fixed; left: 14px; bottom: 12px; color: rgba(230,238,245,0.7); font-size: 12px; z-index: 2; text-shadow: 0 1px 2px #000; }
  #toggle { position: fixed; top: 12px; right: 12px; z-index: 4; display: none; }
  #panel.hidden ~ #toggle { display: block; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent); color: #1b1006; padding: 6px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 6; pointer-events: none; }
  #toast.show { opacity: 1; }
  body.capture #panel, body.capture #hud, body.capture #toggle { display: none !important; }

  @media (max-width: 720px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 48vh; }
    #info { max-height: 38%; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loader"><div>小船正在靠岸…<small>WEBGPU · THREE.JS TSL</small></div></div>

<aside id="panel">
  <header>
    <h1>潮聲島・渲染技巧實驗室</h1>
    <p>把潮聲島的漁村、潟湖和瀑布，用 Minamo 與 Pond Line 的做法重新渲染；可以逐項開關，和遊戲原本的樣子比較。
      <a href="../">← 冰峽灣</a></p>
  </header>
  <div class="scroll">
    <h2>預設風格</h2>
    <div class="chips" id="presets"></div>
    <h2>時段</h2>
    <div class="chips" id="tods"></div>
    <h2>視角</h2>
    <div class="chips" id="views"></div>
    <h2>渲染技巧</h2>
    <div id="techs"></div>
  </div>
  <div id="info"></div>
</aside>
<button class="chip" id="toggle">顯示面板</button>
<div id="hud"></div>
<div id="toast"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
